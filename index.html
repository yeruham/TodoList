<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link href="style.css" rel="stylesheet">
</head>
<body id="body">
    <h1>Todo List</h1>
    <div>
        <h2>task to do:</h2>
        <ul  id="list-tasks">
            <!-- two tasks for example - the delete button doesn't really work -->
            <li class="task">
                <span class="text-task">first task</span>
                <button type="submit" class="delete-task">delete</button>
            </li>
             <li class="task">
                <span class="text-task">seconde task</span>
                <button type="submit" class="delete-task">delete</button>
            </li>
        </ul>
    </div>
    <div>
        <input type="text" id="input-task" placeholder="  write new task">
        <button  id="add-button">save</button>
    </div>
</body>
<script src="script.js"></script>
</html>
