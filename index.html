<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link href="style.css" rel="stylesheet">
</head>
<body id="body">
    <h1>Todo List</h1>
    <div>
        <h2>tasks to do:</h2>
        <ul  id="todo-tasks">
            <!-- task for example - the button's doesn't really works -->
            <li class="task">
                <span class="text-task">first task</span>
                <button type="submit" class="edit-task">edit</button>
                <button type="submit" class="delete-task">delete</button>
                <button type="submit" class="done-task">done</button>
            </li>
        </ul>
    </div>
    <div>
        <input type="text" id="input-task" class="input-text" placeholder="  write new task">
        <button  id="add-button">save</button>
    </div>
    <div>
        <h2>done tasks:</h2>
        <ul id="done-tasks">
            
        </ul>
    </div>
</body>
<script src="script.js"></script>
</html>
