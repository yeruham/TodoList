<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList</title>
    <link href="style.css" rel="stylesheet">
</head>
<body id="body">
    <h1>Todo List</h1>
    <div id="buttons">    
        <button class="delete-task" id="delete-all-tasks">delete all</button>
        <button class="delete-task" id="delete-done-tasks">delete all done tasks</button>
    </div>
    <div>
        <h2>tasks to do:</h2>
        <ul  id="todo-tasks"></ul>
    </div>
    <div>
        <input type="text" id="input-task" class="input-text" placeholder="  write new task">
        <button  id="add-button">save</button>
    </div>
    <div>
        <h2>done tasks:</h2>
        <ul id="done-tasks"></ul>
    </div>
</body>
<script type="module" src="script.js"></script>
</html>
